<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0E0E10" />

    <!-- iOS: "Agregar a inicio" no lee el manifest.json (solo Android/desktop
         lo usan) — estos meta tags son lo que hace que abra sin la barra de
         Safari, con el nombre corto correcto, y con la barra de estado a
         juego con el fondo oscuro del logo. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="publiBe" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>publiBe Dashboard</title>
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
