<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B84FF"/>
      <stop offset="30%" stop-color="#17C3A2"/>
      <stop offset="55%" stop-color="#F4D53E"/>
      <stop offset="78%" stop-color="#F2790A"/>
      <stop offset="100%" stop-color="#C1443C"/>
    </linearGradient>
  </defs>
  <!-- Maskable: el sistema operativo recorta este ícono a su propia forma
       (círculo, squircle, etc.), así que el fondo va a sangre completa (sin
       esquinas redondeadas propias) y la B se achica para vivir dentro de la
       "zona segura" central (~80% del lienzo) y no quedar cortada. -->
  <rect width="64" height="64" fill="#0E0E10"/>
  <text
    x="32" y="41"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="700"
    font-size="28"
    text-anchor="middle"
    fill="url(#bGrad)"
  >B</text>
</svg>
